name: Nightly Automation

on:
  schedule:
    # Run every night at 10:05 UTC (5:05 PM EST, 2:05 PM PST)
    - cron: '5 22 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  GCP_PROJECT: gridmatic-473617
  BQ_DATASET: energy_ercot
  PYTHON_VERSION: '3.10'

jobs:
  nightly-workflow:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT }}
        
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: Configure gcloud
      run: |
        gcloud config set project ${{ env.GCP_PROJECT }}
        gcloud auth configure-docker
        
    - name: Set environment variables
      run: |
        echo "GCP_PROJECT=${{ env.GCP_PROJECT }}" >> $GITHUB_ENV
        echo "BQ_DATASET=${{ env.BQ_DATASET }}" >> $GITHUB_ENV
        echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}" >> $GITHUB_ENV
        echo "NOAA_STATION=72243012960" >> $GITHUB_ENV
        
    - name: Run ETL Pipeline
      run: |
        echo "🔄 Running ETL pipeline..."
        python -c "
        import pipeline.etl_ingest as etl
        print('Starting ETL refresh...')
        etl.ingest_ercot_last_year()
        etl.ingest_weather_last_year()
        etl.build_silver_table()
        print('ETL refresh completed successfully')
        "
        
    - name: Generate Forecasts
      run: |
        echo "🔮 Generating Prophet forecasts..."
        python generate_forecast.py
        
    - name: Run Battery Optimization
      run: |
        echo "🔋 Running battery optimization..."
        python generate_optimization.py
        
    - name: Verify Data Quality
      run: |
        echo "✅ Verifying data quality..."
        python -c "
        from google.cloud import bigquery
        import os
        
        client = bigquery.Client(project=os.environ['GCP_PROJECT'])
        dataset = os.environ.get('BQ_DATASET', 'energy_ercot')
        
        # Check forecast data
        fc_query = f'''
          SELECT COUNT(*) as count, MAX(timestamp_hour) as latest
          FROM \`{os.environ['GCP_PROJECT']}.{dataset}.gold_forecasts\`
          WHERE timestamp_hour >= TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), HOUR)
        '''
        fc_result = client.query(fc_query).to_dataframe()
        print(f'Forecast records: {fc_result.iloc[0][\"count\"]}')
        print(f'Latest forecast: {fc_result.iloc[0][\"latest\"]}')
        
        # Check optimization data
        opt_query = f'''
          SELECT COUNT(*) as count, SUM(expected_profit) as total_profit
          FROM \`{os.environ['GCP_PROJECT']}.{dataset}.gold_optimizer_outputs\`
          WHERE timestamp_hour >= TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), HOUR)
        '''
        opt_result = client.query(opt_query).to_dataframe()
        print(f'Optimization records: {opt_result.iloc[0][\"count\"]}')
        print(f'Total expected profit: \${opt_result.iloc[0][\"total_profit\"]:,.2f}')
        "
        
    - name: Send Success Notification
      if: success()
      run: |
        echo "🎉 Nightly automation completed successfully!"
        echo "📊 Fresh forecasts and optimization results are now available"
        echo "🌐 Dashboard will show updated data on next refresh"
        
    - name: Send Failure Notification
      if: failure()
      run: |
        echo "❌ Nightly automation failed!"
        echo "🔍 Check the logs above for error details"
        echo "⚠️ Dashboard may show stale data until fixed"
